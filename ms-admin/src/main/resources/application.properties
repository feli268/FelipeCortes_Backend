spring.application.name=ms-admin
server.port=${PORT:8083}

# Una sola base de datos fisica compartida por los 3 servicios (tablas separadas por responsabilidad).
# AUTO_SERVER permite que varios procesos abran el mismo archivo H2.
spring.datasource.url=${JDV_DB_URL:jdbc:h2:~/jdv-data/jdv;AUTO_SERVER=TRUE}
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Secreto compartido para firmar y validar tokens (cambiar en cualquier uso real).
jdv.seguridad.secreto=${JDV_SECRETO:secreto-de-desarrollo-jdv-zaror-cambiar-0123456789}
jdv.seguridad.minutos-validez=120
